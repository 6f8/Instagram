name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release tagged v<Version> (Version from InstagramStoryViewer.Gui.csproj)"
        type: boolean
        default: false

permissions:
  contents: write # needed to publish a GitHub Release (and create its tag)

jobs:
  build:
    runs-on: windows-latest
    env:
      # Signing runs only when the Azure Trusted Signing secrets exist (see the "Sign exe" step).
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # NuGet packages are restored from cache when no project file changed.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test (with coverage)
        run: dotnet test tests/InstagramStoryViewer.Tests -c Release --collect "XPlat Code Coverage" --results-directory coverage

      - name: Coverage summary
        shell: pwsh
        run: |
          $report = Get-ChildItem coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          [xml]$xml = Get-Content $report.FullName
          $line = [math]::Round([double]$xml.coverage.'line-rate' * 100, 1)
          $branch = [math]::Round([double]$xml.coverage.'branch-rate' * 100, 1)
          "### Test coverage (core library)`n`nLines: **$line%** · Branches: **$branch%**" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml

      - name: Publish single-file exe
        run: dotnet publish src/InstagramStoryViewer.Gui -c Release -r win-x64 -o out

      # Optional code signing (removes the SmartScreen warning). Runs only when the repository has the
      # Azure Trusted Signing secrets configured; without them the exe is published unsigned, as before.
      - name: Sign exe
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Checksum and version
        id: meta
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/InstagramStoryViewer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  InstagramStoryViewer.exe" | Out-File -Encoding ascii out/InstagramStoryViewer.exe.sha256
          Get-Content out/InstagramStoryViewer.exe.sha256
          $version = (Get-Item out/InstagramStoryViewer.exe).VersionInfo.ProductVersion -replace '\+.*$', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: InstagramStoryViewer-win-x64
          path: |
            out/InstagramStoryViewer.exe
            out/InstagramStoryViewer.exe.sha256

      # A pushed v* tag, or a manual run with "release" ticked (the tag is then created on GitHub).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: IG Story Viewer Pro ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ### تنزيل
            حمّل **InstagramStoryViewer.exe** من الأسفل وشغّله مباشرة (ويندوز 10/11، 64-بت، لا يحتاج تثبيت .NET).

            SHA256: `${{ steps.meta.outputs.sha256 }}`
          files: |
            out/InstagramStoryViewer.exe
            out/InstagramStoryViewer.exe.sha256
