name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to publish a GitHub Release for version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/InstagramStoryViewer.Tests -c Release

      - name: Publish single-file exe
        run: dotnet publish src/InstagramStoryViewer.Gui -c Release -r win-x64 -o out

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/InstagramStoryViewer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  InstagramStoryViewer.exe" | Out-File -Encoding ascii out/InstagramStoryViewer.exe.sha256
          Get-Content out/InstagramStoryViewer.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: InstagramStoryViewer-win-x64
          path: |
            out/InstagramStoryViewer.exe
            out/InstagramStoryViewer.exe.sha256

      - name: Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/InstagramStoryViewer.exe
            out/InstagramStoryViewer.exe.sha256
