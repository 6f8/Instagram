name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release tagged v<Version> (Version from InstagramStoryViewer.Gui.csproj)"
        type: boolean
        default: false

permissions:
  contents: write # needed to publish a GitHub Release (and create its tag)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/InstagramStoryViewer.Tests -c Release

      - name: Publish single-file exe
        run: dotnet publish src/InstagramStoryViewer.Gui -c Release -r win-x64 -o out

      - name: Checksum and version
        id: meta
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/InstagramStoryViewer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  InstagramStoryViewer.exe" | Out-File -Encoding ascii out/InstagramStoryViewer.exe.sha256
          Get-Content out/InstagramStoryViewer.exe.sha256
          $version = (Get-Item out/InstagramStoryViewer.exe).VersionInfo.ProductVersion -replace '\+.*$', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: InstagramStoryViewer-win-x64
          path: |
            out/InstagramStoryViewer.exe
            out/InstagramStoryViewer.exe.sha256

      # A pushed v* tag, or a manual run with "release" ticked (the tag is then created on GitHub).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: IG Story Viewer Pro ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ### تنزيل
            حمّل **InstagramStoryViewer.exe** من الأسفل وشغّله مباشرة (ويندوز 10/11، 64-بت، لا يحتاج تثبيت .NET).

            SHA256: `${{ steps.meta.outputs.sha256 }}`
          files: |
            out/InstagramStoryViewer.exe
            out/InstagramStoryViewer.exe.sha256
