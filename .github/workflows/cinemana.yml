name: cinemana-desktop

on:
  push:
    paths: ["cinemana-desktop/**", ".github/workflows/cinemana.yml"]
  workflow_dispatch:

permissions:
  contents: write # commits the built exe to cinemana-desktop-release/ on the same branch

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The app icon is drawn from the same vector mark as the UI (accent colour) so they always match.
      - name: Export app icon
        run: dotnet run --project cinemana-desktop/Cinemana.Desktop.UiTests -c Release -- --export-icon cinemana-desktop/Cinemana.Desktop/Assets/app.ico

      - name: Publish single small exe
        run: dotnet publish cinemana-desktop/Cinemana.Desktop/Cinemana.Desktop.csproj -c Release -o out

      # Optional signing (removes the "Windows protected your PC" warning) once Azure Trusted Signing
      # secrets are added to the repository; without them the exe is published unsigned.
      - name: Sign exe
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Unit tests
        run: dotnet run --project cinemana-desktop/Cinemana.Desktop.Tests -c Release

      - name: UI regression test
        run: dotnet run --project cinemana-desktop/Cinemana.Desktop.UiTests -c Release

      - name: Size
        shell: pwsh
        run: |
          Get-ChildItem out | Format-Table Name, Length
          $mb = [math]::Round((Get-Item out/Cinemana.exe).Length / 1MB, 2)
          "### Cinemana.exe: **$mb MB**" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Cinemana-win-x64
          path: out/Cinemana.exe

      # Keep the latest exe in the branch so it can be fetched with git (outside the paths that trigger this workflow).
      - name: Commit exe to branch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cinemana-desktop-release | Out-Null
          Copy-Item out/Cinemana.exe cinemana-desktop-release/Cinemana.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cinemana-desktop-release/Cinemana.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Build Cinemana.exe from ${{ github.sha }}"; git push origin HEAD:${{ github.ref_name }} }
          exit 0

      # One GitHub release per app version (tag cinemana-v<Version>); the app's update check reads these.
      - name: Publish release for a new version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Item out/Cinemana.exe).VersionInfo.ProductVersion -replace '\+.*$', ''
          $tag = "cinemana-v$version"
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) { "Release $tag already exists"; exit 0 }
          $hash = (Get-FileHash out/Cinemana.exe -Algorithm SHA256).Hash.ToLower()
          $notes = "سينمانا Desktop $version`n`nحمّل Cinemana.exe وشغّله (يحتاج .NET 10 Desktop Runtime).`n`nSHA256: $hash"
          gh release create $tag out/Cinemana.exe --repo ${{ github.repository }} --target ${{ github.sha }} --title "سينمانا Desktop $version" --notes "$notes"
          exit 0
